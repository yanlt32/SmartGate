<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · SmartGate</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Painel Administrativo</h1>
      <p class="subtitle">SmartGate Acadêmico</p>

      <div id="msg"></div>

      <form id="loginForm">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Entrar</button>
      </form>
    </div>

    <p style="text-align:center; margin-top: 16px;">
      <a href="/">Voltar para a catraca</a>
    </p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msgEl = document.getElementById('msg');

    // se já estiver logado, vai direto pro dashboard
    fetch('/api/admin/me').then((r) => {
      if (r.ok) window.location.href = '/admin/dashboard.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.innerHTML = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          msgEl.innerHTML = `<div class="msg error">${data.error || 'Falha no login.'}</div>`;
          return;
        }

        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        msgEl.innerHTML = '<div class="msg error">Erro de conexão com o servidor.</div>';
      }
    });
  </script>
</body>
</html>
